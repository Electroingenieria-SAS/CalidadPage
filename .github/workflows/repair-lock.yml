name: Repair npm lockfile

on:
  push:
    branches:
      - security/repair-lock-20260827

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate lockfile from package.json
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "security: regenerate npm lockfile"
          git push origin HEAD:security/repair-lock-20260827
